name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The test suite mocks the DB layer (./db/repo), so CI needs neither the
      # Electron binary nor the native better-sqlite3 build that the postinstall
      # step (electron-builder install-app-deps) would trigger. --ignore-scripts
      # keeps the run fast and free of native-toolchain flakiness.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test
