name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # The test suite mocks the DB layer (./db/repo), so CI needs neither the
      # Electron binary nor the native better-sqlite3 build that the postinstall
      # step (electron-builder install-app-deps) would trigger — hence
      # --ignore-scripts, which keeps the run fast and free of native flakiness.
      #
      # We use `npm install` rather than `npm ci`: the committed lockfile carries
      # esbuild's second (vitest/vite) copy leniently under newer npm, which the
      # stricter npm on older runners rejects. `npm install` resolves fresh and
      # fetches the right platform binaries on any npm version.
      - name: Install dependencies
        run: npm install --no-audit --no-fund --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test
